<div style="position: relative; width: 100%; min-height: 100vh; margin: 0; padding: 0; background: #fff;">
    
    <!-- ================= TOPO FIXO (Contador + Seu Banner) ================= -->
    <div style="position: fixed; top: 0; left: 0; width: 100%; z-index: 99999; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        
        <!-- 1. BARRA DO CONTADOR (Igual ao original) -->
        <div style="background-color: #ffcc00; color: #111; padding: 8px 10px; text-align: center; font-family: Arial, sans-serif; font-weight: bold; font-size: 12px; display: flex; justify-content: center; align-items: center; gap: 6px;">
            <span>A RENDELÉSE CSAK ENNYI IDEIG VAN FENNTARTVA</span>
            <span id="timer" style="background-color: #c0392b; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 13px;">01:45</span>
        </div>

        <!-- 2. SEU BANNER CUSTOMIZADO -->
        <div style="width: 100%; height: 80px;">
            <img src="URL_DO_SEU_BANNER_TOPO.jpg" style="width: 100%; height: 100%; object-fit: cover; display: block;" alt="Meu Banner de Topo">
        </div>
    </div>

    <!-- ================= PÁGINA EXTERNA FLUIDA ================= -->
    <!-- O padding-top empurra a página para baixo para o seu banner fixo não tampar os campos do formulário -->
    <iframe src="https://www.vitalis-eu.shop/vit-hun/01uveg?fn=AFF-WL-HUN" 
            style="width: 100%; height: 100vh; border: none; display: block; padding-top: 115px; box-sizing: border-box;" 
            scrolling="yes">
    </iframe>

</div>

<!-- Script funcional do contador -->
<script>
    let tempo = 105; // 1 minuto e 45 segundos
    const timerEl = document.getElementById('timer');
    setInterval(() => {
        if (tempo > 0) {
            tempo--;
            let min = Math.floor(tempo / 60);
            let seg = tempo % 60;
            timerEl.textContent = (min < 10 ? '0' : '') + min + ':' + (seg < 10 ? '0' : '') + seg;
        }
    }, 1000);
</script>
